<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>hyperapp-is</title>
	<script type="module">
		// import
		import { app } from "https://unpkg.com/hyperapp"
		import * as lib from "https://esm.sh/hyperapp-is"

		// vnodes
		const ul = lib.el("ul")
		const li = lib.el("li")

		// entry point
		addEventListener("load", () => {
			app({
				node: document.getElementById("app"),
				init: {
					keys: Object.keys(lib)
				},
				view: state => ul({ id:"app" },
					state.keys.map(key => li({}, key))
				)
			})
		})
	</script>
</head>
<body>
	<h1>hyperapp-is</h1>
	<h2>function names</h2>
	<ul id="app"></ul>
</body>
</html>
